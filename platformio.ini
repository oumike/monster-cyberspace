; Rhino Cyberspace: a Cyberspace (cyberspace.online) client for ESP32 handhelds.
; Boards: Elecrow ThinkNode M9, Seeed Wio Tracker L2. See docs/BUILD.md.

[platformio]
; Own PlatformIO packages, so this repo's pioarduino pin doesn't swap out
; the shared ~/.platformio copies other projects (camillia-mt) build with.
core_dir = ${PROJECT_DIR}/.pio-core

[env]
; pioarduino: Arduino core 3.3 / ESP-IDF 5.5, native on Apple Silicon.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    ricmoo/QRCode@^0.0.1

[env:m9]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_flags =
    -DBOARD_M9
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    ; The M9's console is an external UART bridge, not native USB-CDC.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -std=gnu++17
build_unflags = -std=gnu++11
extra_scripts = post:tools/upload_erase.py

; The firmware with a scripted fake API: every screen works with no account.
[env:m9_fake]
extends = env:m9
build_flags =
    ${env:m9.build_flags}
    -DRC_FAKE_API=1

; Seeed Wio Tracker L2: ESP32-S3, 16 MB flash, 8 MB OPI PSRAM, NV3031B quad-SPI
; panel, GT911 touch, no keyboard. Board flags from camillia-mt's
; [env:wio-tracker-l2]. Touch UI is still to come (docs/TESTING.md).
[env:wio_l2]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_flags =
    -DBOARD_WIO_L2
    -DBOARD_HAS_PSRAM
    ; The Wio's console is the S3's own USB-Serial-JTAG.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -std=gnu++17
build_unflags = -std=gnu++11
extra_scripts = post:tools/upload_erase.py
; LovyanGFX 1.2.27+ has Panel_NV3031B; it only drives the panel here.
; arduino-audio-driver sets up the ES8311 codec for beeps.
lib_deps =
    ${env.lib_deps}
    lovyan03/LovyanGFX@^1.2.35
    https://github.com/pschatzmann/arduino-audio-driver/archive/v0.3.0.zip

[env:wio_l2_fake]
extends = env:wio_l2
build_flags =
    ${env:wio_l2.build_flags}
    -DRC_FAKE_API=1

; Host unit tests for lib/core.
[env:native]
platform = native
framework =
test_framework = unity
build_flags = -DRC_NATIVE=1 -Isrc/ui/fonts
extra_scripts = pre:tools/native_std.py
lib_compat_mode = off
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    ricmoo/QRCode@^0.0.1
