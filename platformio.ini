; Rhino Cyberspace: a Cyberspace (cyberspace.online) client for ESP32 handhelds.
; Milestone 1 targets the Elecrow ThinkNode M9. See docs/BUILD.md.

[env]
; pioarduino: Arduino core 3.3 / ESP-IDF 5.5, native on Apple Silicon.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    ricmoo/QRCode@^0.0.1

[env:m9]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_flags =
    -DBOARD_M9
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    ; The M9's console is an external UART bridge, not native USB-CDC.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -std=gnu++17
build_unflags = -std=gnu++11

; The firmware with a scripted fake API: every screen works with no account.
[env:m9_fake]
extends = env:m9
build_flags =
    ${env:m9.build_flags}
    -DRC_FAKE_API=1

; Host unit tests for lib/core.
[env:native]
platform = native
framework =
test_framework = unity
build_flags = -std=gnu++17 -DRC_NATIVE=1
lib_compat_mode = off
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    ricmoo/QRCode@^0.0.1
