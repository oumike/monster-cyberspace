name: Flasher site

# Publishes the browser flasher (site/index.html, ESP Web Tools) to GitHub
# Pages with the factory images of the latest release. The images are copied
# into the site because browsers cannot fetch GitHub release assets (no CORS
# headers). Runs after each successful Release run, on a release published by
# hand, or from the Actions tab. It never builds firmware.
#
# Needs Pages turned on with "GitHub Actions" as the source
# (Settings -> Pages).

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch the latest release's factory images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          echo "TAG=$tag" >> "$GITHUB_ENV"
          mkdir -p release
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir release \
            --pattern "monster-cyberspace-*-$tag.bin"

      - name: Build the site
        run: ./scripts/pages-site.sh "$TAG" release _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
