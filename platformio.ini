; Host unit tests for lib/core.
[env:native]
platform = native
framework =
test_framework = unity
; The X4 is a development-only target for now: not in CI, releases or tests.
test_ignore =
    test_x4_input
    test_lv_*
; LVGL stays out of the lib/core suite; native_lv tests lib/lvui.
lib_ignore = lvui
build_flags = -DRC_NATIVE=1 -Isrc/ui/fonts
extra_scripts =
    pre:tools/native_std.py
    pre:tools/gen_mascot_presets.py
lib_compat_mode = off
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    ricmoo/QRCode@^0.0.1

; Host tests for lib/lvui (LVGL on the host).
[env:native_lv]
extends = env:native
test_ignore =
test_filter = test_lv_*
lib_ignore =
build_flags =
    ${env:native.build_flags}
    ${lvgl.build_flags}
lib_deps =
    ${env:native.lib_deps}
    ${lvgl.lib_deps}
