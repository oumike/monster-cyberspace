; Xteink X4: ESP32-C3 (one RISC-V core, no PSRAM), 4.26" GDEQ0426T82 e-paper
; used portrait, six buttons on two ADC ladders plus power. From rhino-moshi's
; x4 env and include/boards/x4.h. Console: the C3's native USB-CDC. Without
; PSRAM the renderer draws in strips and the caches are smaller.
[env:x4]
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_16mb.csv
; The grid UI, frozen in src/grid_ui/ (the other boards moved to LVGL): its
; copies replace src/screens/ and src/app/ui_task.cpp, and add ui/renderer.
build_src_filter = +<*> -<screens/> -<app/ui_task.cpp> -<ui/lv/>
; lvui (ignored) still pulls LVGL into libdeps, and the scanner finds it
; through app_state.cpp's #if-ed include, so LVGL is ignored too. One per
; line: pioarduino's hybrid compile (custom_sdkconfig) misreads a one-line list.
lib_ignore =
    lvui
    lvgl
build_flags =
    ; Searched before src/ for every #include "...", so the copies win.
    -iquote src/grid_ui
    -Isrc/grid_ui
    -DRC_UI_GRID=1
    -DBOARD_X4
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; The room log keeps no laid-out lines here, so messages (~650 B each)
    ; are what grows: 20 (two pages) leaves ~70 KB before a request, whose
    ; TLS handshake can take ~55 KB.
    -DRC_CHAT_CAP=20
    -DRC_MAX_REPLIES=30
    -DRC_LOW_MEM=1
    -DRC_MONO_CELLS=1
    ; Barebones, for TLS heap: cIRC rooms only (polled on the one TLS
    ; connection), sent with phrases or web config's Send box.
    -DRC_FEAT_CMAIL=0
    -DRC_FEAT_FEED=0
    -DRC_FEAT_GUILDS=0
    -DRC_FEAT_PEOPLE=0
    -DRC_FEAT_UNREAD=0
    -DRC_FEAT_SPELL=0
    -DRC_FEAT_EMOJI=0
    -DRC_FEAT_OTA=0
    -DRC_FEAT_MASCOT=0
    -DRC_FEAT_NOTES=0
    -std=gnu++17
build_unflags = -std=gnu++11
; Rebuilds the framework (pioarduino hybrid compile) for TLS heap: 4 KB
; out records, mbedTLS buffers sized and freed as needed, no kept peer cert,
; and fewer static Wi-Fi RX buffers.
custom_sdkconfig =
    CONFIG_MBEDTLS_ASYMMETRIC_CONTENT_LEN=y
    CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=16384
    CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=4096
    CONFIG_MBEDTLS_DYNAMIC_BUFFER=y
    CONFIG_MBEDTLS_DYNAMIC_FREE_CONFIG_DATA=y
    CONFIG_MBEDTLS_DYNAMIC_FREE_CA_CERT=y
    '# CONFIG_MBEDTLS_SSL_KEEP_PEER_CERTIFICATE is not set'
    CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM=4
extra_scripts =
    pre:tools/set_app_version.py
    pre:tools/gen_spell_dict.py
    pre:tools/gen_mascot_presets.py
    post:tools/upload_erase.py
lib_deps =
    ${env.lib_deps}
    zinggjm/GxEPD2@1.6.9
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit BusIO@1.17.4

[env:cardputer_adv]
board = esp32-s3-devkitc-1
; ESP32-S3FN8: 8 MB flash, no PSRAM.
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
; The factory app partition (0x7C0000), so the size check is the real limit.
board_upload.maximum_size = 8126464
board_build.partitions = partitions_8mb.csv
build_flags =
    ${lvgl.build_flags}
    -DBOARD_CARDPUTER_ADV
    ; The console is the S3's own USB-Serial-JTAG.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DRC_LOW_MEM=1
    ; Colour panel: keep full-colour cells despite RC_LOW_MEM.
    -DRC_MONO_CELLS=0
    -DRC_CHAT_CAP=150
    -DRC_MAX_REPLIES=30
    ; cIRC, C-Mail, Feed, People and Unread: no Guilds.
    -DRC_FEAT_GUILDS=0
    ; Nor spell check, the emoji tray, OTA or a custom mascot (no partition).
    -DRC_FEAT_SPELL=0
    -DRC_FEAT_EMOJI=0
    -DRC_FEAT_OTA=0
    -DRC_FEAT_MASCOT=0
    -DRC_FEAT_NOTES=0
    -std=gnu++17
build_unflags = -std=gnu++11
extra_scripts =
    pre:tools/set_app_version.py
    pre:tools/gen_spell_dict.py
    post:tools/upload_erase.py
; arduino-audio-driver sets up the ES8311 codec for beeps.
lib_deps =
    ${env.lib_deps}
    ${lvgl.lib_deps}
    https://github.com/pschatzmann/arduino-audio-driver/archive/v0.3.0.zip

