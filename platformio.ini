; Monster for Cyberspace: a Cyberspace (cyberspace.online) client for ESP32 handhelds.
; Boards: Elecrow ThinkNode M9, Seeed Wio Tracker L2, LilyGO T-Deck Plus,
; Elecrow CrowPanel Advance 3.5" and 5.0", LilyGO T-LoRa Pager, LilyGO T-Deck Pro,
; Attaky Mesh Deck, Attaky Cyber Deck Plus, Xteink X4, M5Stack Cardputer ADV,
; LilyGO T-Display P4.
; See docs/BUILD.md.

[platformio]
; Own PlatformIO packages, so this repo's pioarduino pin doesn't swap out
; the shared ~/.platformio copies other projects (camillia-mt) build with.
core_dir = ${PROJECT_DIR}/.pio-core

[env]
; pioarduino: Arduino core 3.3 / ESP-IDF 5.5, native on Apple Silicon.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; src/grid_ui/ is the X4's frozen copy of the grid UI; only [env:x4] builds it.
build_src_filter = +<*> -<grid_ui/>
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    ricmoo/QRCode@^0.0.1

; The LVGL UI (lib/lvui): every firmware env but the X4 adds these.
; lvui is named so it builds (and supplies LVGL's allocator) before
; anything includes it.
[lvgl]
lib_deps =
    lvgl/lvgl@9.5.0
    lvui
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -Ilib/lvui/conf
    -Isrc/ui/fonts

[env:m9]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_16mb.csv
build_flags =
    ${lvgl.build_flags}
    -DBOARD_M9
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    ; The M9's console is an external UART bridge, not native USB-CDC.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -std=gnu++17
build_unflags = -std=gnu++11
extra_scripts =
    pre:tools/set_app_version.py
    pre:tools/gen_spell_dict.py
    pre:tools/gen_mascot_presets.py
    post:tools/upload_erase.py
lib_deps =
    ${env.lib_deps}
    ${lvgl.lib_deps}

