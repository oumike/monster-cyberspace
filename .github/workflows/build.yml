name: Build

on:
  push:
    branches: [ main ]          # catch breakage while it's cheap to fix
    # Skip the build for pushes that cannot change a binary.
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'RELEASE_NOTES.md'
      - '.gitignore'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Only the newest push on a ref is worth checking.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# What this job is for: building from a CLEAN CHECKOUT.
#
# A local `pio run` reuses .pio caches and can see untracked files, so it cannot
# catch an uncommitted header or a .gitignore'd dependency. This job can.
#
# It is a breakage check on ordinary work, not a release gate. Releases are cut
# by .github/workflows/release.yml, which does its own clean build of every
# board. Release commits carry [skip ci] and do not run this, so a release's
# build log is in its release.yml run, not here.
#
# This workflow must NOT publish release assets; release.yml is the single
# source of truth for them. For images of an unreleased tree, run
# `./scripts/release.sh --dist-only` locally.

jobs:
  # The CONTRIBUTING.md rules a machine can check: sign-off on every commit,
  # an SPDX header on every new source file, exact versions for every
  # dependency, no board header outside src/hal/, src/grid_ui/ untouched, no
  # private keys, and no script naming the live Cyberspace API. Pull requests
  # only: pushes to main come from the maintainer and release automation.
  guidelines:
    name: Contribution guidelines
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Guideline checker tests
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v

      - name: Check the pull request against CONTRIBUTING.md
        run: >
          python3 tools/pr_guidelines.py
          ${{ github.event.pull_request.base.sha }}
          ${{ github.event.pull_request.head.sha }}

  build:
    name: PlatformIO build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release target contract
        run: ./scripts/release.sh --check-targets

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO toolchains
        uses: actions/cache@v4
        with:
          path: .pio-core
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Unit tests
        run: |
          pio test -e native
          pio test -e native_lv

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Flasher site tests
        run: node --test site/*.test.mjs

      - name: Build firmware (verify all environments compile)
        run: pio run -e m9 -e wio_l2 -e tdeck -e crowpanel35 -e crowpanel50 -e pager -e tdeck_pro -e mesh_deck -e cyber_deck_plus -e cardputer_adv -e tdisplay_p4 -e tanmatsu
