; Monster for Cyberspace: a Cyberspace (cyberspace.online) client for ESP32 handhelds.
; Boards: Elecrow ThinkNode M9, Seeed Wio Tracker L2, LilyGO T-Deck Plus,
; Elecrow CrowPanel Advance 3.5" and 5.0", LilyGO T-LoRa Pager, LilyGO T-Deck Pro.
; See docs/BUILD.md.

[platformio]
; Own PlatformIO packages, so this repo's pioarduino pin doesn't swap out
; the shared ~/.platformio copies other projects (camillia-mt) build with.
core_dir = ${PROJECT_DIR}/.pio-core

[env]
; pioarduino: Arduino core 3.3 / ESP-IDF 5.5, native on Apple Silicon.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    ricmoo/QRCode@^0.0.1

[env:m9]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_16mb.csv
build_flags =
    -DBOARD_M9
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    ; The M9's console is an external UART bridge, not native USB-CDC.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -std=gnu++17
build_unflags = -std=gnu++11
extra_scripts =
    pre:tools/set_app_version.py
    pre:tools/gen_spell_dict.py
    post:tools/upload_erase.py

; Seeed Wio Tracker L2: ESP32-S3, 16 MB flash, 8 MB OPI PSRAM, NV3031B quad-SPI
; panel, GT911 touch, no keyboard. Board flags from camillia-mt's
; [env:wio-tracker-l2]. Touch UI is still to come (docs/TESTING.md).
[env:wio_l2]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_16mb.csv
build_flags =
    -DBOARD_WIO_L2
    -DBOARD_HAS_PSRAM
    ; The Wio's console is the S3's own USB-Serial-JTAG.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -std=gnu++17
build_unflags = -std=gnu++11
extra_scripts =
    pre:tools/set_app_version.py
    pre:tools/gen_spell_dict.py
    post:tools/upload_erase.py
; LovyanGFX 1.2.27+ has Panel_NV3031B; it only drives the panel here.
; arduino-audio-driver sets up the ES8311 codec for beeps.
lib_deps =
    ${env.lib_deps}
    lovyan03/LovyanGFX@^1.2.35
    https://github.com/pschatzmann/arduino-audio-driver/archive/v0.3.0.zip

; LilyGO T-Deck Plus: ESP32-S3, 16 MB flash, 8 MB OPI PSRAM, ST7789 panel (the
; M9's driver), GT911 touch (the Wio's driver), I2C keyboard, trackball. Board
; flags from camillia-mt's T-Deck env. No LovyanGFX, LVGL or RadioLib.
[env:tdeck]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_16mb.csv
build_flags =
    -DBOARD_TDECK
    -DBOARD_HAS_PSRAM
    ; The T-Deck's console is the S3's own USB-Serial-JTAG.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -std=gnu++17
build_unflags = -std=gnu++11
extra_scripts =
    pre:tools/set_app_version.py
    pre:tools/gen_spell_dict.py
    post:tools/upload_erase.py

; Elecrow CrowPanel Advance 3.5": ESP32-S3 N16R8, ILI9488 SPI panel, GT911
; touch, microSD, optional GPS, no keyboard or buttons. Board details from
; camillia-mt's hw_crowpanel_35.h. The console is UART0 through a CH340.
[env:crowpanel35]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_16mb.csv
build_flags =
    -DBOARD_CROWPANEL_35
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -std=gnu++17
build_unflags = -std=gnu++11
extra_scripts =
    pre:tools/set_app_version.py
    pre:tools/gen_spell_dict.py
    post:tools/upload_erase.py
lib_deps =
    ${env.lib_deps}
    lovyan03/LovyanGFX@^1.2.35

; Elecrow CrowPanel Advance 5.0": ESP32-S3 N16R8, 800x480 RGB panel (LovyanGFX's
; RGB bus, framebuffer in PSRAM), GT911 touch, no keyboard, buttons, SD or GPS.
; Board details from camillia-mt's hw_crowpanel_50.h. Console: UART0 (CH340).
[env:crowpanel50]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_16mb.csv
build_flags =
    -DBOARD_CROWPANEL_50
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -std=gnu++17
build_unflags = -std=gnu++11
extra_scripts =
    pre:tools/set_app_version.py
    pre:tools/gen_spell_dict.py
    post:tools/upload_erase.py
lib_deps =
    ${env.lib_deps}
    lovyan03/LovyanGFX@^1.2.35

[env:pager]
board = esp32-s3-devkitc-1
; The Pager's PSRAM is quad SPI, not octal.
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_16mb.csv
build_flags =
    -DBOARD_PAGER
    -DBOARD_HAS_PSRAM
    ; The Pager's console is the S3's own USB-Serial-JTAG.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -std=gnu++17
build_unflags = -std=gnu++11
extra_scripts =
    pre:tools/set_app_version.py
    pre:tools/gen_spell_dict.py
    post:tools/upload_erase.py
; arduino-audio-driver sets up the ES8311 codec for beeps.
lib_deps =
    ${env.lib_deps}
    https://github.com/pschatzmann/arduino-audio-driver/archive/v0.3.0.zip

[env:tdeck_pro]
board = esp32-s3-devkitc-1
; Quad-SPI PSRAM, as on the Pager.
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_16mb.csv
build_flags =
    -DBOARD_TDECK_PRO
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -std=gnu++17
build_unflags = -std=gnu++11
extra_scripts =
    pre:tools/set_app_version.py
    pre:tools/gen_spell_dict.py
    post:tools/upload_erase.py
; GxEPD2 drives the GDEQ031T10 e-paper.
lib_deps =
    ${env.lib_deps}
    zinggjm/GxEPD2@1.6.9
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit BusIO@1.17.4

; Host unit tests for lib/core.
[env:native]
platform = native
framework =
test_framework = unity
build_flags = -DRC_NATIVE=1 -Isrc/ui/fonts
extra_scripts = pre:tools/native_std.py
lib_compat_mode = off
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    ricmoo/QRCode@^0.0.1
